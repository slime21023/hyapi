name: CI

on:
  push:
    branches: [main]
  pull_request:
    # labeled and unlabeled rerun the API check when "breaking-api" is added or removed.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # hyapi diff compares the example's contracts with the document on main.
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.x
      - run: deno task verify
      - run: deno task publish:check
      - name: Check the example's API changes against main
        # A pull request acknowledges intended breaking changes with the "breaking-api" label.
        run: >-
          deno task diff
          ${{ contains(github.event.pull_request.labels.*.name, 'breaking-api') && '--allow-breaking' || '' }}
        working-directory: apps/example
