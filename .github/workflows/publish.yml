name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.x
      - name: Check tag and package versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          deno eval '
            const tag = Deno.env.get("RELEASE_TAG");
            const expectedVersion = tag?.startsWith("v") ? tag.slice(1) : undefined;
            const workspace = JSON.parse(Deno.readTextFileSync("deno.json")).workspace;
            const packages = workspace
              .map((member) => JSON.parse(Deno.readTextFileSync(`${member}/deno.json`)))
              .filter((member) => typeof member.name === "string");
            const mismatched = packages.filter((member) => member.version !== expectedVersion);
            if (!expectedVersion || packages.length === 0 || mismatched.length > 0) {
              console.error(
                `Release mismatch: tag=${tag}, packages=${packages.map((member) =>
                  `${member.name}@${member.version}`).join(", ")}`,
              );
              Deno.exit(1);
            }
          '
      - run: deno task verify
      - run: deno publish
